name: Instagram daily post

on:
  schedule:
    # 昼の投稿（目標 12:00 JST 前後）。GitHub の schedule は混雑時に遅延・欠落するため
    # （2026-10-21 初回の 03:00 UTC が起動せず手動実行した。2026-10-22 は3回とも約5時間遅れで起動し、
    # 当時の「実行時刻で枠を判定」する仕様のため全部「夕方枠＝予定なし」で空振りした）、
    # 本命は Claude の定期タスク（毎日 11:45 JST に workflow_dispatch で live 起動）。ここの cron は予備。
    # 枠（noon/evening）は実行時刻ではなく起動元の cron から決め、投稿ウィンドウ（昼 11:30〜13:30 JST）を
    # 外れた定期起動は投稿せず Issue を立てる（遅れて夕方・深夜に出るのを防ぐ）。
    # publish.py は投稿済みなら何もしないので、最初に成功した1回だけ投稿され、残りは空振りする。
    - cron: "41 2 * * *"   # 11:41 JST（予備1）
    - cron: "23 3 * * *"   # 12:23 JST（予備2）
    - cron: "13 4 * * *"   # 13:13 JST（予備3。13:30 を過ぎていれば見送り）
    # 18:00 JST 枠（当面未使用。slot: evening の投稿がある日だけ動く）
    - cron: "11 9 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "投稿する日付 YYYY-MM-DD（空なら今日 JST）"
        required: false
      mode:
        description: "live / dry-run / check"
        required: false
        default: "dry-run"
      slot:
        description: "noon / evening（空なら時刻から自動判定）"
        required: false

permissions:
  contents: write
  issues: write

concurrency:
  # 固定グループ名で直列化：予備の起動が本命と同時に走って二重投稿になるのを防ぐ（後続は待ってから実行）
  group: instagram-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      PAGES_BASE_URL: https://hm08050710670-jpg.github.io/instagram-sns-golfguts/posts/
      POST_MODE: ${{ vars.POST_MODE || 'dry-run' }}   # リポジトリ変数 POST_MODE=live にすると本番投稿
    steps:
      # ref: main を明示：待ち行列で待った起動が「起動時点の古いコミット」を取り出して、直前の投稿記録を
      # 見ずに二重投稿するのを防ぐ（既定では起動時の SHA が使われる）
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Ensure ffmpeg (for preflight video checks; failure here only disables the video check)
        # 2026-10-27：apt-get が15分固まり、本命の起動（11:46 JST）がジョブ上限で cancelled → 投稿が出ず手動で再起動した
        # （10/23・10/26〜27 の予備 cron でも同じハング）。3分で打ち切り、入らなければ動画検証を「unavailable」として投稿に進む
        # （integrity.py は ffprobe が無いと unavailable 扱いで合否に使わない）。timeout-minutes は timeout コマンドが効かない場合の保険
        timeout-minutes: 4
        continue-on-error: true
        run: |
          command -v ffprobe >/dev/null && exit 0
          timeout 180 bash -c 'sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg' \
            || echo "ffmpeg unavailable (apt timeout/error, exit $?); video checks will be reported as unavailable" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Decide args
        id: args
        run: |
          MODE="${{ github.event.inputs.mode || env.POST_MODE }}"
          DATE="${{ github.event.inputs.date }}"
          ARGS=""
          if [ -n "$DATE" ]; then ARGS="--date $DATE"; else ARGS="--today"; fi
          SLOT="${{ github.event.inputs.slot }}"
          CRON="${{ github.event.schedule }}"
          # 枠は起動元の cron で決める（実行時刻で決めると、起動が遅れた日に枠を取り違えて空振りする）
          if [ -z "$SLOT" ]; then
            if [ "$CRON" = "11 9 * * *" ]; then SLOT=evening; else SLOT=noon; fi
          fi
          ARGS="$ARGS --slot $SLOT"
          case "$MODE" in
            live) ;;
            check) ARGS="$ARGS --check" ;;
            *) ARGS="$ARGS --dry-run" ;;
          esac
          # 投稿ウィンドウ（定期起動のみ）：昼 11:30〜13:30 JST／夕方 17:45〜19:30 JST。
          # 外れていたら投稿しない（late=1）。手動起動（workflow_dispatch）は人の判断なので対象外
          LATE=0; NOW=$(TZ=Asia/Tokyo date +%H%M); NOW=$((10#$NOW))
          if [ "${{ github.event_name }}" = "schedule" ]; then
            case "$SLOT" in noon) LO=1130; HI=1330;; *) LO=1745; HI=1930;; esac
            if [ "$NOW" -lt "$LO" ] || [ "$NOW" -gt "$HI" ]; then LATE=1; fi
          fi
          echo "now JST=$(TZ=Asia/Tokyo date '+%H:%M') cron='$CRON' slot=$SLOT late=$LATE" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "args=$ARGS" >> $GITHUB_OUTPUT
          echo "mode=$MODE" >> $GITHUB_OUTPUT
          echo "slot=$SLOT" >> $GITHUB_OUTPUT
          echo "late=$LATE" >> $GITHUB_OUTPUT

      - name: Late scheduled run — do not post; open an issue if today's post is still unposted
        if: steps.args.outputs.late == '1'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const S = JSON.parse(fs.readFileSync('automation/schedule.json','utf8'));
            const today = new Date(Date.now() + 9*3600*1000).toISOString().slice(0,10);
            const slot = '${{ steps.args.outputs.slot }}';
            const r = S.find(x => x.date === today && (x.slot || 'noon') === slot);
            const posted = S.some(x => (x.date === today || x.posted_for === today) && (x.slot || 'noon') === slot && x.status === 'posted');
            const now = new Date(Date.now() + 9*3600*1000).toISOString().slice(11,16);
            core.summary.addRaw(`late run at ${now} JST (slot ${slot}); posted today: ${posted}`).write();
            if (posted || (slot === 'evening' && !r)) return;   // 既に投稿済み（本命の Claude 起動が成功）か、夕方枠に予定なし → 何もしない
            await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo,
              title: `定期起動が遅延し、投稿ウィンドウ外のため投稿を見送りました（${today} ${slot} / 起動 ${now} JST）`,
              body: `GitHub の schedule が遅延して ${now} JST に起動したため、この起動では投稿していません（遅れて出すのを防ぐ仕様）。\n\n当日分：${r ? r.label + '（approved=' + r.approved + ', status=' + r.status + '）' : '予定なし（ストック対象）'}\n\n本命の Claude 定期タスク（11:45 JST の workflow_dispatch）も投稿できていない場合は、依頼者の判断で手動起動（mode=live, slot=${slot}, date=${today}）するか、見送ってください。`,
              labels: ['instagram'] });

      - name: Probe public image URL (Pages)
        if: steps.args.outputs.late != '1'
        run: |
          URL="${PAGES_BASE_URL}w1_carousel_01.jpg"
          CODE=$(curl -s -o /dev/null -w "%{http_code}" -I "$URL")
          echo "probe $URL -> $CODE" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$CODE" = "200"

      - name: Publish
        if: steps.args.outputs.late != '1'
        id: pub
        shell: bash {0}
        run: |
          python3 automation/publish.py ${{ steps.args.outputs.args }} > publish.log 2>&1
          CODE=$?
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          {
            echo "### Instagram daily post — mode: ${{ steps.args.outputs.mode }}, args: ${{ steps.args.outputs.args }}, exit: $CODE"
            echo '```'; cat publish.log; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat publish.log
          exit 0

      - name: Commit schedule update
        if: steps.args.outputs.mode == 'live' && steps.pub.outputs.code == '0'
        run: |
          git config user.name "golfguts-bot"
          git config user.email "noreply@golf-guts.co.jp"
          git add automation/schedule.json
          git diff --cached --quiet && exit 0
          git commit -m "post: $(TZ=Asia/Tokyo date +%F) published"
          # 投稿中に別の push があっても記録を必ず残す（2026-10-21 に push が拒否され、投稿済みが未記録になった）。
          # 記録が残らないと予備の起動が二重投稿するため、rebase して最大5回まで再試行する
          for i in 1 2 3 4 5; do
            git push && exit 0
            git fetch origin main && git rebase origin/main || { git rebase --abort; exit 1; }
            sleep 5
          done
          exit 1

      - name: Open issue if the post was published but could not be recorded
        if: failure() && steps.args.outputs.mode == 'live' && steps.pub.outputs.code == '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const log = fs.readFileSync('publish.log','utf8').slice(-3000);
            await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo,
              title: `投稿は成功しましたが schedule.json に記録できませんでした（${new Date().toISOString().slice(0,10)}）`,
              body: "```\n" + log + "\n```\n\n**至急**：schedule.json の当日分を status: posted にして push してください。記録が無いと次の起動で二重投稿になります。", labels: ['instagram'] });

      - name: Open issue on failure or unapproved
        if: steps.args.outputs.late != '1' && steps.pub.outputs.code != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const log = fs.readFileSync('publish.log','utf8').slice(-4000);
            const code = '${{ steps.pub.outputs.code }}';
            const title = code === '2' ? `未承認のため投稿されませんでした（${new Date().toISOString().slice(0,10)}）` : `自動投稿が失敗しました（${new Date().toISOString().slice(0,10)}）`;
            await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title,
              body: "```\n" + log + "\n```\n\n対応：schedule.json の approved を確認するか、ログのエラーを確認してください。", labels: ['instagram'] });

      - name: Fail job if error (not unapproved)
        if: steps.args.outputs.late != '1' && steps.pub.outputs.code != '0' && steps.pub.outputs.code != '2'
        run: exit 1
