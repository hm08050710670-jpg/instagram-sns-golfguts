name: Instagram daily post

on:
  schedule:
    # 昼の投稿（目標 12:00 JST 前後）。GitHub の schedule は混雑時に遅延・欠落するため
    # （2026-10-21 初回の 03:00 UTC が起動せず手動実行した）、00分を避けた時刻で3回起動する。
    # publish.py は投稿済みなら何もしないので、最初に成功した1回だけ投稿され、残りは空振りする。
    - cron: "41 2 * * *"   # 11:41 JST（本命）
    - cron: "23 3 * * *"   # 12:23 JST（予備1）
    - cron: "47 4 * * *"   # 13:47 JST（予備2）
    # 18:00 JST 枠（当面未使用。slot: evening の投稿がある日だけ動く）
    - cron: "11 9 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "投稿する日付 YYYY-MM-DD（空なら今日 JST）"
        required: false
      mode:
        description: "live / dry-run / check"
        required: false
        default: "dry-run"
      slot:
        description: "noon / evening（空なら時刻から自動判定）"
        required: false

permissions:
  contents: write
  issues: write

concurrency:
  # 固定グループ名で直列化：予備の起動が本命と同時に走って二重投稿になるのを防ぐ（後続は待ってから実行）
  group: instagram-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      PAGES_BASE_URL: https://hm08050710670-jpg.github.io/instagram-sns-golfguts/posts/
      POST_MODE: ${{ vars.POST_MODE || 'dry-run' }}   # リポジトリ変数 POST_MODE=live にすると本番投稿
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Ensure ffmpeg (for preflight video checks; failure here only disables the video check)
        run: command -v ffprobe >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg) || echo "ffmpeg unavailable; video checks will be reported as unavailable"

      - name: Decide args
        id: args
        run: |
          MODE="${{ github.event.inputs.mode || env.POST_MODE }}"
          DATE="${{ github.event.inputs.date }}"
          ARGS=""
          if [ -n "$DATE" ]; then ARGS="--date $DATE"; else ARGS="--today"; fi
          SLOT="${{ github.event.inputs.slot }}"
          if [ -z "$SLOT" ]; then
            H=$(date -u +%H); if [ "$H" -ge 6 ] && [ "$H" -lt 18 ]; then SLOT=evening; else SLOT=noon; fi
          fi
          ARGS="$ARGS --slot $SLOT"
          case "$MODE" in
            live) ;;
            check) ARGS="$ARGS --check" ;;
            *) ARGS="$ARGS --dry-run" ;;
          esac
          echo "args=$ARGS" >> $GITHUB_OUTPUT
          echo "mode=$MODE" >> $GITHUB_OUTPUT
          echo "slot=$SLOT" >> $GITHUB_OUTPUT

      - name: Probe public image URL (Pages)
        run: |
          URL="${PAGES_BASE_URL}w1_carousel_01.jpg"
          CODE=$(curl -s -o /dev/null -w "%{http_code}" -I "$URL")
          echo "probe $URL -> $CODE" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$CODE" = "200"

      - name: Publish
        id: pub
        shell: bash {0}
        run: |
          python3 automation/publish.py ${{ steps.args.outputs.args }} > publish.log 2>&1
          CODE=$?
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          {
            echo "### Instagram daily post — mode: ${{ steps.args.outputs.mode }}, args: ${{ steps.args.outputs.args }}, exit: $CODE"
            echo '```'; cat publish.log; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat publish.log
          exit 0

      - name: Commit schedule update
        if: steps.args.outputs.mode == 'live' && steps.pub.outputs.code == '0'
        run: |
          git config user.name "golfguts-bot"
          git config user.email "noreply@golf-guts.co.jp"
          git add automation/schedule.json
          git diff --cached --quiet && exit 0
          git commit -m "post: $(TZ=Asia/Tokyo date +%F) published"
          # 投稿中に別の push があっても記録を必ず残す（2026-10-21 に push が拒否され、投稿済みが未記録になった）。
          # 記録が残らないと予備の起動が二重投稿するため、rebase して最大5回まで再試行する
          for i in 1 2 3 4 5; do
            git push && exit 0
            git fetch origin main && git rebase origin/main || { git rebase --abort; exit 1; }
            sleep 5
          done
          exit 1

      - name: Open issue if the post was published but could not be recorded
        if: failure() && steps.args.outputs.mode == 'live' && steps.pub.outputs.code == '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const log = fs.readFileSync('publish.log','utf8').slice(-3000);
            await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo,
              title: `投稿は成功しましたが schedule.json に記録できませんでした（${new Date().toISOString().slice(0,10)}）`,
              body: "```\n" + log + "\n```\n\n**至急**：schedule.json の当日分を status: posted にして push してください。記録が無いと次の起動で二重投稿になります。", labels: ['instagram'] });

      - name: Open issue on failure or unapproved
        if: steps.pub.outputs.code != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const log = fs.readFileSync('publish.log','utf8').slice(-4000);
            const code = '${{ steps.pub.outputs.code }}';
            const title = code === '2' ? `未承認のため投稿されませんでした（${new Date().toISOString().slice(0,10)}）` : `自動投稿が失敗しました（${new Date().toISOString().slice(0,10)}）`;
            await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title,
              body: "```\n" + log + "\n```\n\n対応：schedule.json の approved を確認するか、ログのエラーを確認してください。", labels: ['instagram'] });

      - name: Fail job if error (not unapproved)
        if: steps.pub.outputs.code != '0' && steps.pub.outputs.code != '2'
        run: exit 1
