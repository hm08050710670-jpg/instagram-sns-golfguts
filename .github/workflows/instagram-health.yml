name: Instagram token & schedule health

on:
  schedule:
    - cron: "30 0 * * 1"     # 毎週月曜 09:30 JST
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Check
        id: chk
        shell: bash {0}
        run: |
          python3 automation/health.py > health.log 2>&1
          CODE=$?
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          { echo "### Health check (exit $CODE)"; echo '```'; cat health.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          cat health.log; exit 0
      - name: Issue on problem
        if: steps.chk.outputs.code != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const log = fs.readFileSync('health.log','utf8').slice(-4000);
            await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo,
              title: `要対応：自動投稿の健全性チェックで問題（${new Date().toISOString().slice(0,10)}）`,
              body: "```\n" + log + "\n```", labels: ['instagram'] });
